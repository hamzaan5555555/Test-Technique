openapi: 3.0.3
info:
  title: EventHub API
  version: 1.0.0
  description: |
    API REST de gestion d'événements, de participants et d'inscriptions.

    **Authentification** : `POST /auth/login` renvoie un JWT. Cliquer sur **Authorize**
    et coller le token (sans le préfixe `Bearer`).

    **Comptes de test (seed)** :
    - admin : `admin@eventhub.com` / `Admin123!`
    - staff : `staff@eventhub.com` / `Staff123!`

    **Règles métier** :
    - impossible d'inscrire un participant sur un événement non publié ;
    - un participant ne peut pas s'inscrire deux fois au même événement ;
    - `maxParticipants` ne peut pas être dépassé (inscriptions `pending` + `confirmed`) ;
    - annuler un événement annule toutes ses inscriptions.

    **Format d'erreur** : `{ "error": { "code": "...", "message": "...", "details": [] } }`
servers:
  - url: /api
    description: Serveur courant
tags:
  - name: Auth
  - name: Events
  - name: Participants
  - name: Registrations
  - name: Dashboard
  - name: Users
    description: Réservé au rôle admin
security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Connexion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Email ou mot de passe incorrect (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Utilisateur connecté
      responses:
        '200':
          description: Utilisateur courant
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /events:
    post:
      tags: [Events]
      summary: Créer un événement (statut initial `draft`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201':
          description: Événement créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Events]
      summary: Lister les événements (filtres et pagination)
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/EventStatus' }
        - name: date
          in: query
          description: Filtre sur le jour de l'événement (AAAA-MM-JJ)
          schema: { type: string, format: date, example: '2026-10-20' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /events/{id}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    get:
      tags: [Events]
      summary: Détail d'un événement
      responses:
        '200':
          description: Événement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Events]
      summary: Modifier un événement (champs partiels)
      description: |
        Impossible sur un événement annulé (`EVENT_CANCELLED`).
        `maxParticipants` ne peut pas descendre sous le nombre d'inscrits actifs
        (`MAX_BELOW_REGISTRATIONS`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventUpdate' }
      responses:
        '200':
          description: Événement modifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}/status:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    patch:
      tags: [Events]
      summary: Publier ou annuler un événement
      description: |
        Transitions autorisées : `draft → published`, `draft → cancelled`,
        `published → cancelled`. Passer à `cancelled` annule **toutes** les inscriptions
        de l'événement (même transaction).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [published, cancelled]
      responses:
        '200':
          description: Événement mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Transition impossible (`INVALID_STATUS_TRANSITION`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /participants:
    post:
      tags: [Participants]
      summary: Créer un participant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParticipantInput' }
      responses:
        '201':
          description: Participant créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Participant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Email déjà utilisé (`DUPLICATE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Participants]
      summary: Lister / rechercher des participants
      parameters:
        - name: search
          in: query
          description: Recherche partielle sur `fullName` ou `email`
          schema: { type: string, maxLength: 100 }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Participant' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /participants/{id}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    get:
      tags: [Participants]
      summary: Détail d'un participant
      responses:
        '200':
          description: Participant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Participant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Participants]
      summary: Modifier un participant (champs partiels)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParticipantUpdate' }
      responses:
        '200':
          description: Participant modifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Participant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Participants]
      summary: Supprimer un participant
      description: Ses inscriptions sont supprimées en cascade.
      responses:
        '204':
          description: Supprimé
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /registrations:
    post:
      tags: [Registrations]
      summary: Inscrire un participant à un événement
      description: |
        Règles vérifiées dans une transaction (verrou sur l'événement) :
        - événement `published` sinon 409 `EVENT_NOT_PUBLISHED` ;
        - pas de doublon sinon 409 `ALREADY_REGISTERED` ;
        - capacité non dépassée sinon 409 `EVENT_FULL`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationInput' }
      responses:
        '201':
          description: Inscription créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Événement ou participant introuvable (`EVENT_NOT_FOUND`, `PARTICIPANT_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Registrations]
      summary: Lister les inscriptions
      parameters:
        - name: eventId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RegistrationStatus' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Registration' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /registrations/{id}/status:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    patch:
      tags: [Registrations]
      summary: Changer le statut d'une inscription
      description: |
        Réactiver une inscription annulée (`cancelled → pending/confirmed`) revérifie la
        capacité (409 `EVENT_FULL`) et est refusé si l'événement est annulé (`EVENT_CANCELLED`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/RegistrationStatus' }
      responses:
        '200':
          description: Inscription mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Statistiques du tableau de bord
      responses:
        '200':
          description: Indicateurs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users:
    get:
      tags: [Users]
      summary: Lister les utilisateurs (admin)
      responses:
        '200':
          description: Utilisateurs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      summary: Créer un utilisateur (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '201':
          description: Utilisateur créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{id}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    put:
      tags: [Users]
      summary: Modifier un utilisateur (admin)
      description: Un admin ne peut pas modifier son propre rôle (`CANNOT_CHANGE_OWN_ROLE`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Utilisateur modifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Users]
      summary: Supprimer un utilisateur (admin)
      description: |
        Impossible de se supprimer soi-même (`CANNOT_DELETE_SELF`) ni de supprimer un
        utilisateur qui a créé des événements (409 `USER_HAS_EVENTS`).
      responses:
        '204':
          description: Supprimé
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 20 }

  responses:
    BadRequest:
      description: Données invalides (`VALIDATION_ERROR`, `INVALID_JSON`, `INVALID_INPUT`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Token manquant, invalide ou expiré (`TOKEN_MISSING`, `INVALID_TOKEN`, `TOKEN_EXPIRED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Rôle insuffisant (`INSUFFICIENT_ROLE`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflit avec une règle métier ou une contrainte d'unicité
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: EVENT_FULL }
            message: { type: string, example: 'Événement complet : inscription impossible' }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }

    Pagination:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 42 }
        totalPages: { type: integer, example: 3 }

    Role:
      type: string
      enum: [admin, staff]
    EventStatus:
      type: string
      enum: [draft, published, cancelled]
    RegistrationStatus:
      type: string
      enum: [pending, confirmed, cancelled]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: admin@eventhub.com }
        password: { type: string, example: 'Admin123!' }
    LoginResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        createdAt: { type: string, format: date-time }
    UserInput:
      type: object
      required: [email, password, fullName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72, description: 'Au moins une lettre et un chiffre' }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    UserUpdate:
      type: object
      description: Au moins un champ requis
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/Role' }

    Event:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string, nullable: true }
        location: { type: string }
        eventDate: { type: string, format: date-time }
        maxParticipants: { type: integer }
        status: { $ref: '#/components/schemas/EventStatus' }
        createdBy: { type: string, format: uuid }
        registrationsCount:
          type: integer
          description: Places prises (inscriptions pending + confirmed)
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EventInput:
      type: object
      required: [title, location, eventDate, maxParticipants]
      properties:
        title: { type: string, minLength: 3, maxLength: 200, example: Workshop React & Node.js }
        description: { type: string, nullable: true }
        location: { type: string, example: 'Rabat - Salle B12' }
        eventDate:
          type: string
          description: Date et heure (ISO 8601, ex 2026-10-20T18:30)
          example: '2026-10-20T18:30:00Z'
        maxParticipants: { type: integer, minimum: 1, example: 50 }
    EventUpdate:
      type: object
      description: Au moins un champ requis
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        location: { type: string }
        eventDate: { type: string }
        maxParticipants: { type: integer, minimum: 1 }

    Participant:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    ParticipantInput:
      type: object
      required: [fullName, email]
      properties:
        fullName: { type: string, example: Youssef El Amrani }
        email: { type: string, format: email }
        phone: { type: string, nullable: true, example: '+212600000001' }
    ParticipantUpdate:
      type: object
      description: Au moins un champ requis
      properties:
        fullName: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }

    Registration:
      type: object
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        participantId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RegistrationStatus' }
        participant:
          type: object
          properties:
            id: { type: string, format: uuid }
            fullName: { type: string }
            email: { type: string, format: email }
        event:
          type: object
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            status: { $ref: '#/components/schemas/EventStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RegistrationInput:
      type: object
      required: [eventId, participantId]
      properties:
        eventId: { type: string, format: uuid }
        participantId: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, confirmed]
          default: pending

    DashboardStats:
      type: object
      properties:
        totalEvents: { type: integer }
        publishedEvents: { type: integer }
        registrationsToday:
          type: integer
          description: Inscriptions créées aujourd'hui (hors annulées)
        topEvents:
          type: array
          description: Top 5 des événements publiés les plus remplis
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              eventDate: { type: string, format: date-time }
              maxParticipants: { type: integer }
              status: { $ref: '#/components/schemas/EventStatus' }
              registrationsCount: { type: integer }
              fillRate: { type: number, description: 'Taux de remplissage en %' }